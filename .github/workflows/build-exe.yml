name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app for desktop
        run: npm run build:desktop

      - name: Build Electron exe
        run: npm run electron:build

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/*.exe

  # Publishes a real GitHub Release with the exe + the update metadata files
  # (latest.yml, .blockmap) that electron-updater needs to detect and download
  # new versions. Only runs when you push a version tag like v1.0.0.
  # IMPORTANT: bump the "version" field in package.json before tagging, or
  # electron-updater won't see the release as newer.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write   # needed so electron-builder can create/attach to the Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:desktop
      - name: Build and publish exe
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}